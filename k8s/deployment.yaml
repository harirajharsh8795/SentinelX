apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel-backend
  template:
    metadata:
      labels:
        app: sentinel-backend
    spec:
      containers:
      - name: backend
        image: canara-sentinel-ai-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: database-url
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-backend-svc
spec:
  type: ClusterIP
  selector:
    app: sentinel-backend
  ports:
  - port: 8000
    targetPort: 8000
